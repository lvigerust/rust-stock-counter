# Builds the Windows executable on demand. GPUI compiles its DirectX shaders
# with Windows SDK tools, so it can't be cross-compiled from macOS. Run it
# from the Actions tab; it replaces the "latest" release with the new build,
# which anyone can download without signing in to GitHub.
name: Windows build

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked
        env:
          # Links the C runtime statically, so the executable runs without
          # the Visual C++ Redistributable installed.
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Name the executable after the application
        shell: bash
        run: |
          mkdir dist
          cp target/release/varetelling.exe "dist/Scala Bad.exe"

      - name: Replace the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "dist/Scala Bad.exe" \
            --target "$GITHUB_SHA" \
            --title "Latest Windows build" \
            --notes "Built from $GITHUB_SHA." \
            --latest
