[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/varetelling"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Every crate names its dependencies here once, so versions can't drift
# between crates. A crate opts in with `name.workspace = true`.
[workspace.dependencies]
stocktake = { path = "crates/stocktake" }
stocktake_ui = { path = "crates/stocktake_ui" }
ui = { path = "crates/ui" }

calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
gpui-kit = "0.7"
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Lints beyond Clippy's defaults that every crate opts into with
# `[lints] workspace = true`. `warn` is enough: the checks run with
# `-D warnings`. Silence one locally with `#[expect(...)]` and a reason, not
# by relaxing it here.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panicking is for tests (clippy.toml allows `unwrap` there); production code
# returns a `Result` or names the invariant in an `expect`.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Borrow what isn't consumed, and don't build the fallback before it's needed.
needless_pass_by_value = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
# `let … else`, `map_or_else` and `Self` are the idioms the code uses already.
manual_let_else = "warn"
map_unwrap_or = "warn"
use_self = "warn"
